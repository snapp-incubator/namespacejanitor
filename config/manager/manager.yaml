apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: namespacejanitor
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/instance: system
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: namespacejanitor
    app.kubernetes.io/part-of: namespacejanitor
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: namespacejanitor-operator-system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: namespacejanitor
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/instance: system
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: namespacejanitor
    app.kubernetes.io/part-of: namespacejanitor
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=0.0.0.0:8081
          - --config=/etc/namespacejanitor/config.yaml
        image: ghcr.io/snapp-incubator/namespacejanitor:v1.0.4
        name: manager
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 20
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 30
          periodSeconds: 10

        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /etc/namespacejanitor
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: namespacejanitor-namespacejanitor-config
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
